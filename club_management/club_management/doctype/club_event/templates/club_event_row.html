<div>

{% if doc.published %}
<div class="col-lg-4 col-md-6 mb-4">
  <div class="card h-100 shadow-sm border-0">

	<!-- Cover Image -->
	<a href="/{{ doc.route }}">
	  <img
		src="{{ doc.cover or '/assets/club_management/images/default-event.png' }}"
		class="card-img-top"
		alt="{{ doc.event_name }}"
		style="height: 220px; object-fit: cover;"
	  >
	</a>

	<div class="card-body d-flex flex-column">

	  <!-- Event Name -->
	  <h5 class="card-title">
		<a href="/{{ doc.route }}" class="text-dark">
			{{ (doc.title or doc.name) |e }}
		</a>
	  </h5>

	  <!-- Event Date -->
	  <p class="mb-1 text-muted">
		<i class="fa fa-calendar"></i>
		{{ doc.event_date }}
	  </p>

	  <!-- Organizer -->
	  <p class="mb-3 text-muted">
		<i class="fa fa-user"></i>
		{{ doc.organizer }}
	  </p>

	  <!-- View Button -->
	  <div class="mt-auto d-flex justify-content-between">
		<a class="btn btn-info"  href="/{{ doc.route |e }}">
		  View Event
		</a>
		{% if frappe.utils.getdate(doc.event_date) >= frappe.utils.getdate() %}
		<a class="btn btn-success"  href="/event-participart/new?event={{doc.name}}">Register</a>
		{% endif %}
	  </div>

	</div>
  </div>
</div>
{% endif %}
</div>
<!-- this is a sample default list template -->
